<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | SkillSwap</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><a class="brand" href="index.html">Skill<span>Swap</span></a><nav class="nav"><a href="index.html">Home</a><a href="login.html">Login</a></nav></header><main class="auth-wrap"><form id="registerForm" class="auth-card card"><div class="eyebrow">Start exchanging</div><h1>Create your account</h1><p class="muted">Tell the community what you can share.</p><div id="formMessage"></div><div class="field"><label for="name">Full name</label><input id="name" name="name" required autocomplete="name" placeholder="Your name"></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></div><button class="full" type="submit">Create account</button><p class="tiny center">Already registered? <a href="login.html" style="color:var(--primary);font-weight:700">Log in</a></p></form></main><script src="js/app.js"></script></body></html>
